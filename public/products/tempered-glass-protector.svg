<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#dbeafe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softGlass" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- phone, centered-left -->
  <g filter="url(#soft)">
    <rect x="178" y="128" width="196" height="392" rx="34" fill="url(#phoneBody)"/>
    <rect x="192" y="160" width="168" height="328" rx="14" fill="url(#screen)"/>
    <rect x="248" y="140" width="56" height="7" rx="3.5" fill="#334155"/>
    <circle cx="276" cy="500" r="10" fill="#334155"/>
  </g>

  <!-- tempered glass panel, offset above-right to show it's a separate accessory -->
  <g filter="url(#softGlass)">
    <rect x="284" y="96" width="196" height="392" rx="30" fill="url(#glass)" stroke="#94a3b8" stroke-width="2"/>
    <rect x="284" y="96" width="196" height="392" rx="30" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6"/>
    <!-- glare -->
    <path d="M 300 120 L 330 120 L 300 240 L 300 120 Z" fill="#ffffff" opacity="0.55"/>
    <path d="M 344 108 L 362 108 L 300 340 L 300 320 Z" fill="#ffffff" opacity="0.35"/>
  </g>

  <text x="300" y="566" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="18" fill="#64748b" letter-spacing="0.5">9H Tempered Glass</text>
</svg>
